<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loan Default Scoring</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Loan Default Scoring</span>
      </div>
    </nav>

    <main class="container">
      <div class="row">
        <div class="col-md-6">
          <h5>Quick single-row input</h5>
          <form id="singleForm">
            <div id="fields" class="mb-3">
              <!-- Example inputs: users should replace/add features used by their model -->
              <div class="mb-2">
                <label class="form-label">int_rate</label>
                <input type="number" step="0.0001" class="form-control" name="int_rate" value="0.12">
              </div>
              <div class="mb-2">
                <label class="form-label">loan_amnt</label>
                <input type="number" class="form-control" name="loan_amnt" value="5000">
              </div>
              <div class="mb-2">
                <label class="form-label">dti</label>
                <input type="number" step="0.01" class="form-control" name="dti" value="10">
              </div>
            </div>
            <button type="button" id="scoreSingle" class="btn btn-primary">Score single row</button>
          </form>
        </div>
        <div class="col-md-6">
          <h5>Or paste JSON rows</h5>
          <textarea id="jsonRows" class="form-control" rows="8">[{"int_rate":0.12,"loan_amnt":5000,"dti":10}]</textarea>
          <div class="mt-2 d-flex gap-2">
            <button id="scoreBulk" class="btn btn-success">Score JSON rows</button>
            <button id="clearLog" class="btn btn-secondary">Clear results</button>
          </div>
        </div>
      </div>

      <hr class="my-4">
      <h5>Results</h5>
      <div id="results" class="mt-2"></div>
    </main>

    <script>
    const api = '/score';

    function renderResults(items){
      const container = document.getElementById('results');
      if(!items || items.length===0){ container.innerHTML = '<div class="alert alert-warning">No results</div>'; return; }
      let html = '<table class="table table-sm"><thead><tr><th>#</th><th>prob_default</th><th>pred_default</th></tr></thead><tbody>';
      items.forEach(it=>{ html += `<tr><td>${it.index}</td><td>${it.prob_default.toFixed(4)}</td><td>${it.pred_default}</td></tr>` });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    document.getElementById('scoreSingle').addEventListener('click', async ()=>{
      const form = document.getElementById('singleForm');
      const data = {};
      new FormData(form).forEach((v,k)=>{ data[k] = isNaN(v)? v : Number(v) });
      const payload = { rows: [data] };
      try{
        const r = await fetch(api, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
        const j = await r.json();
        if(r.ok) renderResults(j.results);
        else document.getElementById('results').innerHTML = `<pre class="text-danger">${JSON.stringify(j,null,2)}</pre>`;
      }catch(e){ document.getElementById('results').innerHTML = `<pre class="text-danger">${e}</pre>`; }
    });

    document.getElementById('scoreBulk').addEventListener('click', async ()=>{
      const t = document.getElementById('jsonRows').value;
      let rows;
      try{ rows = JSON.parse(t); if(!Array.isArray(rows)) throw new Error('JSON must be an array of row objects'); }
      catch(e){ document.getElementById('results').innerHTML = `<div class="alert alert-danger">Invalid JSON: ${e}</div>`; return; }
      try{
        const r = await fetch(api, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({rows})});
        const j = await r.json();
        if(r.ok) renderResults(j.results);
        else document.getElementById('results').innerHTML = `<pre class="text-danger">${JSON.stringify(j,null,2)}</pre>`;
      }catch(e){ document.getElementById('results').innerHTML = `<pre class="text-danger">${e}</pre>`; }
    });

    document.getElementById('clearLog').addEventListener('click', ()=>{ document.getElementById('results').innerHTML = ''; });
    </script>
  </body>
</html>
